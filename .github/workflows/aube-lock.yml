name: aube-lock

# Regenerates aube-lock.yaml on Renovate branches, runs merge-gate scripts, and
# publishes Check Runs on the final HEAD (no GitHub App). See
# johnsyweb/renovate-config and ADR 0011.

on:
  push:
    branches: ['renovate/**']

permissions:
  contents: write
  checks: write

jobs:
  aube-lock:
    uses: johnsyweb/renovate-config/.github/workflows/aube-lock.yml@9ea278f1fec188654ba871a0c12fd6742531d68c
    with:
      verify_command: ./script/cibuild
      check_name: renovate-verify
