paranoid: true
packageManagerStrictVersion: true
# 7 days — aligned with Renovate minimumReleaseAge in johnsyweb/renovate-config
minimumReleaseAge: 10080
allowBuilds:
  puppeteer: true
  unrs-resolver: true
overrides:
  js-yaml: ">=4.2.0"
  uuid: ">=11.1.1"
  http-proxy-middleware: ">=3.0.6"
  handlebars: ">=4.7.10"
  shell-quote: ">=1.11.0"
# Security patches younger than the cooling window (remove once aged in).
minimumReleaseAgeExclude:
  - handlebars
  - shell-quote
